# Accept the VMware End User License Agreement
vmaccepteula

# Set the root password for the DCUI and Tech Support Mode
rootpw --iscrypted $6$aUmDksTC3e90tpYH$tbaQYvPLdBATpGItypjhKdxeZFNvouK6MNZcgCacBtI6DUePxAWn0eAgpmmR5IhopbusW9MyMLsjymiNq0dgs0

#for Local boot
DISKIDPLACEHOLDER

# Set the network to DHCP on the first network adapater


network --bootproto=static   --ip=10.10.10.10 --netmask=255.255.255.0 --gateway=10.10.10.1 --hostname=myhost --nameserver=11.12.13.14

%pre --interpreter=busybox
hwclock -d %LIVE_VAR_DATE_1% -t %LIVE_VAR_TIME_UTC_1%
date -s %LIVE_VAR_DATE_TIME_UTC_1%
cd /tmp

%firstboot --interpreter=busybox
cd /tmp
esxcfg-vswitch -A 'VM Network' vSwitch0

###############################
# enable & start remote ESXi Shell  (SSH)
###############################
vim-cmd hostsvc/enable_ssh
vim-cmd hostsvc/start_ssh

###############################
# enable & start ESXi Shell (TSM)
###############################
vim-cmd hostsvc/enable_esx_shell
vim-cmd hostsvc/start_esx_shell

esxcli system hostname set --host=myhost


# Script executed for configuration to be retained after secure boot is enabled


esxcli system hostname set --fqdn=myhost

# Retrieve the hostname using esxcli and store it in a file
ESXCLI_OUTPUT=$(esxcli system hostname get)
HOSTNAME=$(printf '%s\n' "$ESXCLI_OUTPUT" | awk '/Host Name:/ { sub(/^.*Host Name:[[:space:]]*/, ""); sub(/[[:space:]].*$/, ""); print; exit }')
echo \"$HOSTNAME\" >> host-detail_tmp.yaml

PID=$(esxcli --formatter=csv --format-param=fields=\"ProductName\" hardware platform get | awk -F',' 'NR==2 {print $1}')
NETFN="0x36"
if echo "$PID" | grep -q "CAI-845A"; then
    NETFN="0x34"
elif echo "$PID" | grep -q "UCSC-885A"; then
    NETFN="0x30"
fi

UCS_TOOL_VERSION=$(esxcli software component list | grep -i 'ucs-tool' | awk '{ for (i = 1; i <= NF; i++) { if ($i ~ /^[0-9][0-9]*([.][0-9][0-9]*)+/) { print $i; exit } } }')
UCS_TOOL_MAJOR=${UCS_TOOL_VERSION%%.*}
XINSTALL_LOG=/var/log/Xinstall.log
echo "\"OS INSTALL COMPLETED\"" >> $XINSTALL_LOG

if echo "$UCS_TOOL_MAJOR" | grep -q '^[0-9][0-9]*$' && [ "$UCS_TOOL_MAJOR" -ge 2 ]; then
    /bin/esxcli ucstool ipmi --option write --netfn $NETFN --inp /tmp/host-detail_tmp.yaml --outp host-detail.yaml
    /bin/esxcli ucstool ipmi --option write --netfn $NETFN --inp $XINSTALL_LOG --outp osProgress.log
else
    /opt/ucs_tool_esxi/ucs_ipmitool write_file host-detail_tmp.yaml host-detail.yaml
    /opt/ucs_tool_esxi/ucs_ipmitool write_file $XINSTALL_LOG osProgress.log
fi


# Disable ESXi shell
vim-cmd hostsvc/disable_esx_shell

%post --interpreter=busybox --ignorefailure=true

cd /tmp
localcli network firewall set --default-action true
localcli network firewall set --enabled false

localcli network firewall set --default-action false
localcli network firewall set --enabled true

# Let us poweroff/shutdown our selves.
reboot
